name: Publish live demo

# Builds the app and publishes it to the gh-pages branch on every push to main.
# GitHub Pages serves that branch at https://pawar17.github.io/Nexus/
# (Settings > Pages > Source: Deploy from a branch > gh-pages / root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /Nexus/
      # Single-page app: serve index.html for deep links like /Nexus/talk
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
